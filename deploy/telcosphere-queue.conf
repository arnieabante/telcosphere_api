; Optional. Copy to /etc/supervisor/conf.d/ and set MIKROTIK_SCHEDULER_RUNS_QUEUE=false.
; Replace the paths and user with your own.
[program:telcosphere-queue]
command=/usr/bin/php /var/www/telcosphere_api/artisan queue:work --sleep=1 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=90
stdout_logfile=/var/www/telcosphere_api/storage/logs/queue.log
redirect_stderr=true
